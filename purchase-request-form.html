<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نموذج طلب شراء داخلي — قيمة المالية</title>
  <style>
    :root {
      --primary: #675398;
      --primary-dark: #442182;
      --gold: #C4981A;
      --soft: #f6f3fb;
      --line: #ddd7ea;
      --text: #1f2937;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #ede9f5;
      color: var(--text);
      font-size: 13px;
    }
    .toolbar {
      max-width: 920px;
      margin: 0 auto;
      padding: 14px 12px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .toolbar h1 { margin: 0; color: var(--primary-dark); font-size: 20px; }
    .actions { display: flex; gap: 7px; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 8px; padding: 8px 14px;
      font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; }
    .btn-light { background: #fff; color: var(--primary-dark); border: 1px solid var(--line); }

    .sheet {
      max-width: 920px; margin: 0 auto 24px;
      background: #fff; border-radius: 16px;
      box-shadow: 0 10px 28px rgba(68,33,130,.08);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #5a4490 0%, #442182 100%);
      color: #fff; padding: 14px 18px;
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
    }

    .title-box { text-align: center; }
    .title-box h2 { margin: 0; font-size: 18px; }

    .number-box {
      text-align: center;
      background: rgba(255,255,255,.13);
      padding: 8px;
      border-radius: 10px;
    }

    .content { padding: 14px; display: grid; gap: 12px; }

    .section {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }

    .field { display: flex; flex-direction: column; gap: 4px; }

    input, textarea, select {
      border: 1px solid #ddd4f0;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      background: #faf9fd;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 6px; border-bottom: 1px solid #eee; font-size: 12px; }
    th { background: #f6f3fb; }

    .status-message { margin-top: 10px; font-weight: bold; color: var(--primary-dark); }
  </style>
</head>
<body>

<div class="toolbar">
  <h1>طلب شراء</h1>
  <div class="actions">
    <button class="btn-light" onclick="addItemRow()">+ صنف</button>
    <button class="btn-primary" onclick="submitRequest()">إرسال</button>
    <button class="btn-primary" onclick="window.print()">طباعة</button>
  </div>
</div>

<div class="sheet">
  <div class="header">
    <div></div>
    <div class="title-box"><h2>طلب شراء داخلي</h2></div>
    <div class="number-box" id="requestBadge">--</div>
  </div>

  <div class="content">

    <div class="section">
      <h3 class="section-title">بيانات الطلب</h3>
      <div class="grid-2">
        <input id="requestDate" type="date">
        <input id="requesterName" placeholder="الاسم">
        <input id="department" placeholder="القسم">
        <input id="email" placeholder="البريد">
        <input id="phone" placeholder="الجوال">
        <input id="neededDate" type="date">
      </div>
    </div>

    <div class="section">
      <h3 class="section-title">تفاصيل</h3>
      <textarea id="purpose" placeholder="الغرض"></textarea>
      <input id="vendor" placeholder="المورد المقترح">

      <table>
        <thead>
          <tr>
            <th>الصنف</th><th>الكمية</th><th>الوحدة</th>
          </tr>
        </thead>
        <tbody id="itemsTableBody"></tbody>
      </table>
    </div>

    <div class="section">
      <textarea id="notes" placeholder="ملاحظات"></textarea>
      <textarea id="extraNotes" placeholder="ملاحظات إضافية"></textarea>
    </div>

    <div id="statusMessage" class="status-message"></div>

  </div>
</div>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwM3_3fjYyy7wqFM6LvCr8A3G1b_BAotZ1LT_vMuVJq/dev";

function addItemRow(){
  const tbody = document.getElementById('itemsTableBody');
  const row = document.createElement('tr');
  row.innerHTML = `
    <td><input class="item-name"></td>
    <td><input class="item-qty"></td>
    <td><input class="item-unit"></td>
  `;
  tbody.appendChild(row);
}

function collectItems(){
  let items = [];
  document.querySelectorAll('#itemsTableBody tr').forEach(r=>{
    const name = r.querySelector('.item-name').value;
    const qty = r.querySelector('.item-qty').value;
    const unit = r.querySelector('.item-unit').value;
    if(name) items.push(name + " - " + qty + " " + unit);
  });
  return items.join("\n");
}

async function submitRequest(){
  const status = document.getElementById('statusMessage');
  status.textContent = "جاري الإرسال...";

  const data = {
    requestDate: requestDate.value,
    requesterName: requesterName.value,
    department: department.value,
    email: email.value,
    phone: phone.value,
    purpose: purpose.value,
    neededDate: neededDate.value,
    vendor: vendor.value,
    notes: notes.value,
    items: collectItems(),
    extraNotes: extraNotes.value
  };

  try{
    const res = await fetch(WEB_APP_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify(data)
    });

    const result = await res.json();

    document.getElementById('requestBadge').textContent = result.requestNumber;
    status.textContent = "تم الحفظ بنجاح";

  }catch(e){
    status.textContent = "فشل الإرسال";
  }
}

addItemRow();

</script>

</body>
</html>
